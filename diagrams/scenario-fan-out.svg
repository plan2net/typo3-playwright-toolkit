<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="fan-out-title fan-out-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fan-out-title">One setup, every browser</title>
<desc id="fan-out-desc">One test file runs its setup once. If the setup succeeds it produces state and a test database of its own, which every browser project then reuses. If the setup fails, the tests of that file are skipped with the reason rather than failing individually.</desc>

<defs>
    <marker id="fo-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
    <marker id="fo-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#ED6D05"/>
    </marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<line x1="440" y1="104" x2="440" y2="152" stroke="#5B6570" stroke-width="1.2" marker-end="url(#fo-arrow)"/>
<path d="M 408,240 V 280 Q 408,288 400,288 H 208 Q 200,288 200,296 V 320" fill="none" stroke="#ED6D05" stroke-width="2" marker-end="url(#fo-arrow-accent)"/>
<path d="M 472,240 V 280 Q 472,288 480,288 H 672 Q 680,288 680,296 V 320" fill="none" stroke="#5B6570" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fo-arrow)"/>
<line x1="88" y1="408" x2="88" y2="480" stroke="#5B6570" stroke-width="1.2" marker-end="url(#fo-arrow)"/>
<line x1="200" y1="408" x2="200" y2="480" stroke="#5B6570" stroke-width="1.2" marker-end="url(#fo-arrow)"/>
<line x1="312" y1="408" x2="312" y2="480" stroke="#5B6570" stroke-width="1.2" marker-end="url(#fo-arrow)"/>

<rect x="276" y="264" width="56" height="16" rx="2" fill="#FFFFFF"/>
<text x="304" y="276" fill="#A05E00" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.04em">BUILT</text>

<rect x="544" y="264" width="64" height="16" rx="2" fill="#FFFFFF"/>
<text x="576" y="276" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.04em">FAILED</text>

<rect x="340" y="48" width="200" height="56" rx="6" fill="#FFFFFF"/>
<rect x="340" y="48" width="200" height="56" rx="6" fill="rgba(91,101,112,0.10)" stroke="#8A93A0" stroke-width="1"/>
<text x="440" y="82" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">One test file</text>

<rect x="280" y="152" width="320" height="88" rx="6" fill="#FFFFFF"/>
<rect x="280" y="152" width="320" height="88" rx="6" fill="#ffffff" stroke="#1A1E24" stroke-width="1"/>
<text x="440" y="192" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">The setup runs once</text>
<text x="440" y="214" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">builds content through the backend</text>

<rect x="40" y="320" width="320" height="88" rx="6" fill="#FFFFFF"/>
<rect x="40" y="320" width="320" height="88" rx="6" fill="rgba(255,135,0,0.10)" stroke="#ED6D05" stroke-width="1.2"/>
<text x="200" y="360" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">State + its own database</text>
<text x="200" y="382" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">built once, read by all</text>

<rect x="520" y="320" width="320" height="88" rx="6" fill="#FFFFFF"/>
<rect x="520" y="320" width="320" height="88" rx="6" fill="rgba(26,30,36,0.02)" stroke="rgba(26,30,36,0.30)" stroke-width="1" stroke-dasharray="5,4"/>
<text x="680" y="360" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">Tests skip, with the reason</text>
<text x="680" y="382" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">one broken setup, no cascade</text>

<rect x="40" y="480" width="96" height="48" rx="6" fill="#FFFFFF"/>
<rect x="40" y="480" width="96" height="48" rx="6" fill="#ffffff" stroke="#1A1E24" stroke-width="1"/>
<text x="88" y="509" fill="#1A1E24" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">chromium</text>

<rect x="152" y="480" width="96" height="48" rx="6" fill="#FFFFFF"/>
<rect x="152" y="480" width="96" height="48" rx="6" fill="#ffffff" stroke="#1A1E24" stroke-width="1"/>
<text x="200" y="509" fill="#1A1E24" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">firefox</text>

<rect x="264" y="480" width="96" height="48" rx="6" fill="#FFFFFF"/>
<rect x="264" y="480" width="96" height="48" rx="6" fill="#ffffff" stroke="#1A1E24" stroke-width="1"/>
<text x="312" y="509" fill="#1A1E24" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">webkit</text>

<line x1="40" y1="576" x2="840" y2="576" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>
<text x="40" y="604" fill="#5B6570" font-size="11" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.14em">LEGEND</text>

<rect x="140" y="592" width="20" height="16" rx="2" fill="rgba(255,135,0,0.10)" stroke="#ED6D05" stroke-width="1.2"/>
<text x="172" y="604" fill="#5B6570" font-size="11" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">BUILT ONCE, READ BY EVERY PROJECT</text>

<line x1="520" y1="600" x2="560" y2="600" stroke="rgba(26,30,36,0.30)" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="572" y="604" fill="#5B6570" font-size="11" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">THE PATH YOU HOPE NOT TO TAKE</text>
</svg>
