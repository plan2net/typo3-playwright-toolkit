<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="1136" viewBox="20 0 344 1136" role="img" aria-labelledby="where-things-run-narrow-title where-things-run-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="where-things-run-narrow-title">Where the browsers run</title>
<desc id="where-things-run-narrow-desc">A decision tree with three outcomes. If the browsers can live in the web container, TYPO3, the test runner and the browsers all sit there and you only install the browsers. If they cannot but you want to keep the ddev playwright commands, the browsers move to a browser server container while TYPO3 and the test runner stay in the web container, connected by PW_TEST_CONNECT_WS_ENDPOINT. If you give the ddev commands up, the test runner moves with the browsers into a Playwright container of your own, leaving TYPO3 alone in the web container, and both sides share PLAYWRIGHT_TOOLKIT_SECRET.</desc>

