<?xml version="1.0" encoding="UTF-8"?>
<svg width="384" height="940" viewBox="0 0 384 940" role="img" aria-labelledby="packages-overview-narrow-title packages-overview-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="packages-overview-narrow-title">Three packages, one test run</title>
<desc id="packages-overview-narrow-desc">One DDEV command runs the Playwright test files. Every test file sends its own test ID to TYPO3, which copies a prepared database template into a fresh database in about thirty milliseconds, on a separate database service.</desc>

<defs>
