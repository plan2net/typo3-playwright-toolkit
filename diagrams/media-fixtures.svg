<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="504" viewBox="0 0 880 504" role="img" aria-labelledby="mf-title mf-desc" xmlns="http://www.w3.org/2000/svg">
<title id="mf-title">Where a media fixture lives</title>
<desc id="mf-desc">A folder of committed media files becomes three separate things when the test database template is prepared. The files are copied into a FAL storage and shared read-only by every test, which is where the browser loads them from. The sys_file and sys_file_metadata rows go into the template and are copied along with each test's own database. A name-to-uid manifest is written for the npm package, which reads it to turn a fixture name into a uid.</desc>

<defs>
    <marker id="mf-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<text x="40" y="48" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.14em">COMMITTED</text>
<text x="312" y="48" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.14em">WRITTEN BY PREPARE</text>
<text x="640" y="48" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.14em">READ DURING THE RUN</text>

