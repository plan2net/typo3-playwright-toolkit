<rect x="48" y="552" width="272" height="88" rx="6" fill="#FFFFFF" stroke="rgba(237,109,5,0.40)" stroke-width="0.8"/>

<line x1="192" y1="296" x2="192" y2="368" stroke="#1A1E24" stroke-width="2" marker-end="url(#ohod-n-arrow-ink)"/>
<rect x="204" y="324" width="110" height="16" rx="2" fill="#FFFFFF"/>
<text x="208" y="336" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">SAVES CONTENT</text>

<line x1="192" y1="456" x2="192" y2="560" stroke="#1A1E24" stroke-width="2" marker-end="url(#ohod-n-arrow-ink)"/>
<rect x="204" y="476" width="88" height="16" rx="2" fill="#FFFFFF"/>
<text x="208" y="488" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">BY TEST ID</text>

<line x1="192" y1="744" x2="192" y2="648" stroke="#5B6570" stroke-width="1.2" marker-end="url(#ohod-n-arrow)"/>
<rect x="204" y="688" width="104" height="16" rx="2" fill="#FFFFFF"/>
<text x="208" y="700" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">COPY, ≈30 MS</text>

<rect x="56" y="208" width="272" height="88" rx="6" fill="#FFFFFF"/>
<rect x="56" y="208" width="272" height="88" rx="6" fill="#FFFFFF" stroke="#1A1E24" stroke-width="1"/>
<text x="192" y="248" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">Your test files</text>
