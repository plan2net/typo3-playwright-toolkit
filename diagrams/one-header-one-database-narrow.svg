<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="784" viewBox="20 120 344 784" role="img" aria-labelledby="ohod-narrow-title ohod-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ohod-narrow-title">One test file, one database</title>
<desc id="ohod-narrow-desc">Every test file saves its own pages and content through the TYPO3 site's record edit route, and TYPO3 writes them, by test ID, into a database that belongs to that file alone. Each database is a copy of one template, built once from the schema and a small fixture on a separate database container, and is dropped when the run ends.</desc>

<defs>
    <marker id="ohod-n-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
    <marker id="ohod-n-arrow-ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#1A1E24"/>
    </marker>
</defs>

<rect x="20" width="344" height="100%" fill="#FFFFFF"/>

<rect x="32" y="504" width="320" height="376" rx="8" fill="rgba(26,30,36,0.02)" stroke="rgba(26,30,36,0.28)" stroke-width="1" stroke-dasharray="6,5"/>
<text x="192" y="868" fill="rgba(26,30,36,0.62)" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.10em">SEPARATE DB CONTAINER</text>

<!-- The cards behind each stack, before the arrows, so an arrowhead reaching the front card stays visible. -->
