<text x="964" y="114" fill="#1A1E24" font-size="14" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">builders.page().create()</text>

<!-- The insert goes around the box. Bypassing it is the whole point. -->
