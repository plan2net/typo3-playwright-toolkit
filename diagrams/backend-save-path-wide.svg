<text x="316" y="114" fill="#1A1E24" font-size="14" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">tests/fixtures/pages.sql</text>

<rect x="748" y="52" width="432" height="80" rx="6" fill="#FFFFFF"/>
