<style>
/* Self-hosted, like the landing page: a Google Fonts stylesheet would send every
   visitor's IP address to Google before the page renders. */
@font-face { font-family:'Open Sans'; font-style:normal; font-weight:400 800; font-display:swap; src:url(../website/fonts/open-sans.woff2) format('woff2'); }
@font-face { font-family:'Source Code Pro'; font-style:normal; font-weight:400 600; font-display:swap; src:url(../website/fonts/source-code-pro.woff2) format('woff2'); }

:root { --paper:#FFFFFF; --ink:#1A1E24; --muted:#5B6570; --rule:rgba(26,30,36,0.12); }
* { box-sizing:border-box; }
body {
    margin:0; padding:48px 32px; background:var(--paper); color:var(--ink);
    font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
main { max-width:1440px; margin:0 auto; }
.eyebrow {
    margin:0 0 8px; font-family:'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted);
}
h1 { margin:0 0 4px; font-size:28px; font-weight:800; letter-spacing:-0.01em; }
.sub { margin:0 0 16px; font-size:15px; line-height:1.6; color:var(--muted); max-width:64ch; }
svg { display:block; width:100%; height:auto; }
/* Container query, not viewport: a wide window can still hand the diagram a narrow
   column, and a viewport query would answer "wide" and shrink the drawing to fit. */
.figure { container-type:inline-size; }
.tablet, .narrow { display:none; margin:0 auto; }
.tablet { max-width:720px; }
.narrow { max-width:344px; }
@container (max-width: 1099px) {
    .wide { display:none; }
    .tablet { display:block; }
}
@container (max-width: 699px) {
    .tablet { display:none; }
    .narrow { display:block; }
}
footer {
    margin:24px 0 0; padding-top:12px; border-top:1px solid var(--rule);
    font-family:'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);
}
</style>
</head>
<body>
<main>
    <p class="eyebrow">TYPO3 Playwright Toolkit</p>
    <h1>Where a test's content comes from</h1>
    <p class="sub">Two ways to give a test the pages it needs. Only one of them runs the code TYPO3 runs when an editor presses Save — which is why only one of them notices when your data model changes.</p>

<title id="bsp-title">A SQL fixture skips the backend; this toolkit posts through it</title>
<desc id="bsp-desc">Two columns. On the left, a SQL fixture file inserts rows straight into the database, its arrow curving around a dashed box marked skipped entirely that holds FormEngine fields, permissions, DataHandler, TCA rules and file relations. A renamed field still inserts, so the test passes while the page is broken. On the right, a builder posts to the backend route /typo3/record/edit with a real record_edit token, straight through that same box, which is live. A renamed field is refused and the test fails, naming the record and the reason. Both routes end at the same database.</desc>
