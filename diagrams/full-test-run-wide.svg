<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="1044" viewBox="0 0 1280 1044" role="img" aria-labelledby="ftr-wide-title ftr-wide-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ftr-wide-title">A full test run</title>
<desc id="ftr-wide-desc">Once per run, the DDEV command has TYPO3 rebuild the database template if the schema or fixtures changed, then starts Playwright, whose preflight checks the API version and provisions a first database. Once per test file, Playwright writes down that file's test ID, asks TYPO3 for a backend session, and TYPO3 copies the template into a database of its own before it boots; content is then posted to the backend's own record edit route, which answers with the record it saved. Every test in the file reuses that database, and teardown asks TYPO3 to drop every database the run created. Both the session and the record posts carry the API secret as well as the test ID.</desc>

