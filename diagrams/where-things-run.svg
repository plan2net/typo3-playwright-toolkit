<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="648" viewBox="0 0 880 648" role="img" aria-labelledby="where-things-run-title where-things-run-desc" xmlns="http://www.w3.org/2000/svg">
<title id="where-things-run-title">Where the browsers run</title>
<desc id="where-things-run-desc">A decision tree with three outcomes. If the browsers can live in the web container, TYPO3, the test runner and the browsers all sit there and you only install the browsers. If they cannot but you want to keep the ddev playwright commands, the browsers move to a browser server container while TYPO3 and the test runner stay in the web container, connected by PW_TEST_CONNECT_WS_ENDPOINT. If you give the ddev commands up, the test runner moves with the browsers into a Playwright container of your own, leaving TYPO3 alone in the web container, and both sides share PLAYWRIGHT_TOOLKIT_SECRET.</desc>

<defs>
    <marker id="wtr-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
    <marker id="wtr-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#ED6D05"/>
    </marker>
</defs>

