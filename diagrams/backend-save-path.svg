<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="692" viewBox="0 0 720 692" role="img" aria-labelledby="bsp-t-title bsp-t-desc" xmlns="http://www.w3.org/2000/svg">
<title id="bsp-t-title">A SQL fixture skips the backend; this toolkit posts through it</title>
<desc id="bsp-t-desc">Two columns. On the left a SQL fixture file inserts straight into the database, its arrow curving around a dashed box marked skipped that holds FormEngine fields, permissions, DataHandler, TCA rules and file relations, so a renamed field still inserts and the test passes while the page is broken. On the right a builder posts to the backend route, straight through that same box, which is live, so a renamed field is refused and the test fails. Both routes end at the same database.</desc>

<defs>
    <marker id="bspt-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#8A93A0"/></marker>
    <marker id="bspt-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#ED6D05"/></marker>
</defs>

