<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="1266" viewBox="14 0 344 1266" role="img" aria-labelledby="bsp-n-title bsp-n-desc" xmlns="http://www.w3.org/2000/svg">
<title id="bsp-n-title">A SQL fixture skips the backend; this toolkit posts through it</title>
<desc id="bsp-n-desc">Two stacked halves. First, a SQL fixture file inserts straight into the database, its arrow curving around a dashed box marked skipped that holds FormEngine fields, permissions, DataHandler, TCA rules and file relations, so a renamed field still inserts and the test passes while the page is broken. Second, a builder posts to the backend route, straight through that same box, which is live, so a renamed field is refused and the test fails. Both routes end at the same database.</desc>

<defs>
    <marker id="bspn-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#8A93A0"/></marker>
    <marker id="bspn-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#ED6D05"/></marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<text x="192" y="28" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.18em">WHAT A SQL FIXTURE DOES</text>

