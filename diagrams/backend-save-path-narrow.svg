<text x="111" y="136" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.04em">INSERT INTO pages</text>

<rect x="44" y="196" width="300" height="212" rx="8" fill="rgba(91,101,112,0.05)" stroke="#8A93A0" stroke-width="1" stroke-dasharray="6,5"/>
