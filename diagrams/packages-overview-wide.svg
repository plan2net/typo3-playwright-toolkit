<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="packages-overview-title packages-overview-desc" xmlns="http://www.w3.org/2000/svg">
<title id="packages-overview-title">Three packages, one test run</title>
<desc id="packages-overview-desc">One DDEV command runs the Playwright test files and asks the TYPO3 extension to prepare one database template up front. Every test file then sends its own test ID to TYPO3, which copies that template into a fresh database in about thirty milliseconds, on a separate database service.</desc>

<defs>
