        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
    <marker id="po-arrow-ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#1A1E24"/>
    </marker>
    <marker id="po-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#ED6D05"/>
    </marker>
</defs>

