@font-face { font-family:'Open Sans'; font-style:normal; font-weight:400 800; font-display:swap; src:url(../website/fonts/open-sans.woff2) format('woff2'); }
@font-face { font-family:'Source Code Pro'; font-style:normal; font-weight:400 600; font-display:swap; src:url(../website/fonts/source-code-pro.woff2) format('woff2'); }

:root { --paper:#FFFFFF; --ink:#1A1E24; --muted:#5B6570; --rule:rgba(26,30,36,0.12); }
* { box-sizing:border-box; }
body {
    margin:0; padding:48px 32px; background:var(--paper); color:var(--ink);
    font-family:'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
main { max-width:960px; margin:0 auto; }
.eyebrow {
    margin:0 0 8px; font-family:'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted);
}
h1 { margin:0 0 4px; font-size:28px; font-weight:800; letter-spacing:-0.01em; }
.sub { margin:0 0 16px; font-size:15px; line-height:1.6; color:var(--muted); max-width:64ch; }
svg { display:block; width:100%; height:auto; }
/* Container query, not viewport: a wide window can still hand the diagram a narrow
   column, and a viewport query would answer "wide" and shrink the drawing to fit. */
.figure { container-type:inline-size; }
.narrow { display:none; margin:0 auto; max-width:344px; }
.wide { max-width:880px; margin:0 auto; }
@container (max-width: 699px) {
    .wide { display:none; }
    .narrow { display:block; }
}
@media (max-width: 699px) { body { padding:32px 20px; } }
footer {
    margin-top:16px; padding-top:12px; border-top:1px solid var(--rule);
    font-family:'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--muted);
}
</style>
</head>
<body>
<main>
    <p class="eyebrow">TYPO3 Playwright Toolkit</p>
    <h1>Where the browsers run</h1>
    <p class="sub">TYPO3 always runs in the web container. The browsers do not have to, and neither does the test run. Which of the three layouts you need comes down to two questions, and each layout names the one setting it takes.</p>

<div class="figure">
<svg class="wide" viewBox="0 0 880 648" role="img" aria-labelledby="where-things-run-title where-things-run-desc" xmlns="http://www.w3.org/2000/svg">
<title id="where-things-run-title">Where the browsers run</title>
<desc id="where-things-run-desc">A decision tree with three outcomes. If the browsers can live in the web container, TYPO3, the test runner and the browsers all sit there and you only install the browsers. If they cannot but you want to keep the ddev playwright commands, the browsers move to a browser server container while TYPO3 and the test runner stay in the web container, connected by PW_TEST_CONNECT_WS_ENDPOINT. If you give the ddev commands up, the test runner moves with the browsers into a Playwright container of your own, leaving TYPO3 alone in the web container, and both sides share PLAYWRIGHT_TOOLKIT_SECRET.</desc>
