<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="1060" viewBox="20 0 344 1060" role="img" aria-labelledby="ftr-narrow-title ftr-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ftr-narrow-title">A full test run</title>
<desc id="ftr-narrow-desc">The thirteen steps of a run in order. Once per run the DDEV command has TYPO3 rebuild the database template if it changed, starts Playwright, and Playwright's preflight checks the API version and provisions a first database. Once per test file Playwright writes that file's test ID down, asks TYPO3 for a session, TYPO3 copies the template before it boots, and content is posted to the backend's record edit route, which answers with the record it saved. Every test in the file reuses that database, then teardown drops every database the run created.</desc>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<rect x="40" y="48" width="304" height="264" rx="8" fill="rgba(26,30,36,0.02)" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>
<text x="120" y="71" fill="rgba(26,30,36,0.62)" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.14em">ONCE PER RUN</text>

<text x="64" y="93" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">01  DDEV → TYPO3</text>
<text x="64" y="113" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">playwright:prepare</text>
<line x1="64" y1="128" x2="320" y2="128" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="149" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">02  TYPO3 → DATABASE</text>
<text x="64" y="169" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">build the template, if changed</text>
<line x1="64" y1="184" x2="320" y2="184" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="205" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">03  DDEV → NPM</text>
<text x="64" y="225" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">npx playwright test</text>
<line x1="64" y1="240" x2="320" y2="240" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="261" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">04  NPM → TYPO3</text>
<text x="64" y="281" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">preflight: version + a database</text>

<rect x="40" y="328" width="304" height="376" rx="8" fill="rgba(26,30,36,0.02)" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>
<text x="148" y="351" fill="rgba(26,30,36,0.62)" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.14em">ONCE PER TEST FILE</text>

<text x="64" y="373" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">05  NPM</text>
<text x="64" y="393" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">write the test ID down first</text>
<line x1="64" y1="408" x2="320" y2="408" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="429" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">06  NPM → TYPO3</text>
<text x="64" y="449" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">POST test-api/session</text>
<line x1="64" y1="464" x2="320" y2="464" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="485" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">07  TYPO3 → DATABASE</text>
<text x="64" y="505" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">copy the template, pre-boot</text>
<line x1="64" y1="520" x2="320" y2="520" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="541" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">08  TYPO3 → NPM</text>
<text x="64" y="561" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">cookie + record_edit token</text>
<line x1="64" y1="576" x2="320" y2="576" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="597" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">09  NPM → TYPO3</text>
<text x="64" y="617" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">POST /typo3/record/edit</text>
<line x1="64" y1="632" x2="320" y2="632" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<rect x="52" y="644" width="4" height="36" rx="2" fill="#ED6D05"/>
<text x="64" y="653" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">10  TYPO3 → NPM</text>
<text x="64" y="673" fill="#A05E00" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">302 + the saved record</text>

<rect x="40" y="720" width="304" height="208" rx="8" fill="rgba(26,30,36,0.02)" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>
<text x="179" y="743" fill="rgba(26,30,36,0.62)" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.14em">EVERY TEST, THEN TEARDOWN</text>

<text x="64" y="765" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">11  NPM → TYPO3</text>
<text x="64" y="785" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">page.goto(), same test ID</text>
<line x1="64" y1="800" x2="320" y2="800" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="821" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">12  NPM → TYPO3</text>
<text x="64" y="841" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">POST databases/drop</text>
<line x1="64" y1="856" x2="320" y2="856" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>

<text x="64" y="877" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">13  TYPO3 → DATABASE</text>
<text x="64" y="897" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">DROP DATABASE + images</text>

<line x1="40" y1="968" x2="344" y2="968" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>
<rect x="40" y="988" width="4" height="16" rx="2" fill="#ED6D05"/>
<text x="56" y="1000" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">WHAT THE BUILDERS GET BACK</text>
</svg>
