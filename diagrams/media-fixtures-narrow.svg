<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="696" viewBox="20 0 344 696" role="img" aria-labelledby="mf-narrow-title mf-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="mf-narrow-title">Where a media fixture lives</title>
<desc id="mf-narrow-desc">A folder of committed media files becomes three separate things when the test database template is prepared. The files are copied into a FAL storage and shared read-only by every test, which is where the browser loads them from. The sys_file and sys_file_metadata rows go into the template and are copied along with each test's own database. A name-to-uid manifest is written for the npm package, which reads it to turn a fixture name into a uid.</desc>

<defs>
    <marker id="mfn-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<line x1="192" y1="104" x2="192" y2="136" stroke="#5B6570" stroke-width="1.2" marker-end="url(#mfn-arrow)"/>
<line x1="192" y1="240" x2="192" y2="256" stroke="#5B6570" stroke-width="1.2" marker-end="url(#mfn-arrow)"/>
<line x1="192" y1="368" x2="192" y2="384" stroke="#5B6570" stroke-width="1.2" marker-end="url(#mfn-arrow)"/>
<line x1="192" y1="496" x2="192" y2="512" stroke="#5B6570" stroke-width="1.2" marker-end="url(#mfn-arrow)"/>

<rect x="40" y="48" width="304" height="56" rx="6" fill="#FFFFFF"/>
