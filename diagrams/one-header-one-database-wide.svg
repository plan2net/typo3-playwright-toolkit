<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="776" viewBox="0 0 1280 776" role="img" aria-labelledby="ohod-wide-title ohod-wide-desc" xmlns="http://www.w3.org/2000/svg">
<title id="ohod-wide-title">One test file, one database</title>
<desc id="ohod-wide-desc">Three test files each save their own pages and content through one TYPO3 site's record edit route. TYPO3 writes each file's content, by its test ID, into a database of its own. All three databases are copies of one template, built once from the schema and a small fixture on a separate database container, and are dropped when the run ends.</desc>

