<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="800" viewBox="20 0 344 800" role="img" aria-labelledby="fan-out-narrow-title fan-out-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="fan-out-narrow-title">One setup, every browser</title>
<desc id="fan-out-narrow-desc">One test file runs its setup once. If the setup succeeds it produces state and a test database of its own, which every browser project then reuses. If the setup fails, the tests of that file are skipped with the reason rather than failing individually.</desc>

<defs>
    <marker id="fon-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
    <marker id="fon-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#ED6D05"/>
    </marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<line x1="192" y1="104" x2="192" y2="152" stroke="#5B6570" stroke-width="1.2" marker-end="url(#fon-arrow)"/>
<path d="M 160,240 V 272 Q 160,280 152,280 H 120 Q 112,280 112,288 V 320" fill="none" stroke="#ED6D05" stroke-width="2" marker-end="url(#fon-arrow-accent)"/>
<path d="M 224,240 V 272 Q 224,280 232,280 H 264 Q 272,280 272,288 V 320" fill="none" stroke="#5B6570" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#fon-arrow)"/>
<line x1="112" y1="392" x2="112" y2="440" stroke="#5B6570" stroke-width="1.2" marker-end="url(#fon-arrow)"/>

<rect x="40" y="48" width="304" height="56" rx="6" fill="#FFFFFF"/>
<rect x="40" y="48" width="304" height="56" rx="6" fill="rgba(91,101,112,0.10)" stroke="#8A93A0" stroke-width="1"/>
<text x="192" y="82" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">One test file</text>

<rect x="40" y="152" width="304" height="88" rx="6" fill="#FFFFFF"/>
<rect x="40" y="152" width="304" height="88" rx="6" fill="#ffffff" stroke="#1A1E24" stroke-width="1"/>
<text x="192" y="192" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">The setup runs once</text>
<text x="192" y="214" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">through the real backend</text>

<rect x="40" y="320" width="144" height="72" rx="6" fill="#FFFFFF"/>
<rect x="40" y="320" width="144" height="72" rx="6" fill="rgba(255,135,0,0.10)" stroke="#ED6D05" stroke-width="1.2"/>
<rect x="52" y="332" width="58" height="22" rx="3" fill="transparent" stroke="rgba(237,109,5,0.50)" stroke-width="0.8"/>
<text x="81" y="343" fill="#A05E00" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.08em" dy="4">BUILT</text>
<text x="112" y="371" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">state + database</text>

<rect x="200" y="320" width="144" height="72" rx="6" fill="#FFFFFF"/>
<rect x="200" y="320" width="144" height="72" rx="6" fill="rgba(26,30,36,0.02)" stroke="rgba(26,30,36,0.30)" stroke-width="1" stroke-dasharray="5,4"/>
<rect x="212" y="332" width="67" height="22" rx="3" fill="transparent" stroke="rgba(26,30,36,0.35)" stroke-width="0.8"/>
<text x="246" y="343" fill="#5B6570" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.08em" dy="4">FAILED</text>
<text x="272" y="371" fill="#1A1E24" font-size="14" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">tests skip</text>

<rect x="40" y="440" width="304" height="168" rx="8" fill="rgba(26,30,36,0.02)" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>
<!-- No masking chip: nothing crosses here, so one would only show as a pale band. -->
<text x="64" y="464" fill="rgba(26,30,36,0.62)" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.14em">EVERY PROJECT READS IT</text>

<rect x="64" y="480" width="256" height="32" rx="6" fill="#ffffff" stroke="#1A1E24" stroke-width="1"/>
<text x="192" y="501" fill="#1A1E24" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">chromium</text>

<rect x="64" y="520" width="256" height="32" rx="6" fill="#ffffff" stroke="#1A1E24" stroke-width="1"/>
<text x="192" y="541" fill="#1A1E24" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">firefox</text>

<rect x="64" y="560" width="256" height="32" rx="6" fill="#ffffff" stroke="#1A1E24" stroke-width="1"/>
<text x="192" y="581" fill="#1A1E24" font-size="13" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">webkit</text>

<line x1="40" y1="700" x2="344" y2="700" stroke="rgba(26,30,36,0.10)" stroke-width="0.8"/>
<rect x="40" y="720" width="20" height="16" rx="2" fill="rgba(255,135,0,0.10)" stroke="#ED6D05" stroke-width="1.2"/>
<text x="72" y="732" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">BUILT ONCE</text>

<line x1="40" y1="764" x2="80" y2="764" stroke="rgba(26,30,36,0.30)" stroke-width="1.2" stroke-dasharray="5,4"/>
<text x="92" y="768" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">IF THE SETUP FAILS</text>
</svg>
