name: checks

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolkit:
    name: toolkit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typo3-playwright-toolkit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/typo3-playwright-toolkit/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Packs and installs the tarball into a temp consumer, so a publish that
      # would ship no dist, or exports a CommonJS consumer cannot resolve, fails
      # here rather than at a consumer.
      - run: npm run test:pack

      # --omit=dev, because the tarball ships dist/ and one runtime dependency:
      # everything else is vitest's and eslint's tree, which no consumer installs.
      # Auditing it would turn an advisory in a bundler into a red build on every
      # unrelated push. Dependabot watches the dev tree instead.
      - name: Security advisories
        run: npm audit --omit=dev --audit-level=high

  extension-qa:
    name: extension (qa)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/playwright-toolkit
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, intl
          coverage: none

      - run: composer update --no-interaction --no-progress

      - run: composer qa

      # --abandoned=ignore because TYPO3 13 still requires doctrine/annotations,
      # which is abandoned but not vulnerable; without it this is red forever and
      # a real advisory would be indistinguishable from that noise.
      - name: Security advisories
        run: composer audit --locked --abandoned=ignore

  # Both suites against every supported core on every PHP that core allows. This
  # is the only lane that executes the package's code against another TYPO3:
  # typo3-versions analyses it, which cannot see a behavioural change like TYPO3
  # 14 swapping the session-id hash out from under the seeded row.
  #
  # Each core needs its own test toolchain — testing-framework 7 for 11.5, 8 for
  # 12.4, 9 for 13.4 and 14.3 — so the constraints are pinned per row rather than
  # taken from composer.json.
  extension:
    name: extension (typo3 ${{ matrix.typo3 }}, php ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 11.5 allows 7.4-8.2; 8.1 is the package's own floor.
          - { typo3: '11.5', php: '8.1', framework: '^7.1', phpunit: '^10.1' }
          - { typo3: '11.5', php: '8.2', framework: '^7.1', phpunit: '^10.1' }
          - { typo3: '12.4', php: '8.1', framework: '^8.3', phpunit: '^10.1' }
          - { typo3: '12.4', php: '8.2', framework: '^8.3', phpunit: '^11.0' }
          - { typo3: '12.4', php: '8.3', framework: '^8.3', phpunit: '^11.0' }
          - { typo3: '12.4', php: '8.4', framework: '^8.3', phpunit: '^11.0' }
          - { typo3: '13.4', php: '8.2', framework: '^9.0', phpunit: '^11.2' }
          - { typo3: '13.4', php: '8.3', framework: '^9.0', phpunit: '^12.1' }
          - { typo3: '13.4', php: '8.4', framework: '^9.0', phpunit: '^12.1' }
          - { typo3: '14.3', php: '8.2', framework: '^9.0', phpunit: '^11.2' }
          - { typo3: '14.3', php: '8.3', framework: '^9.0', phpunit: '^12.1' }
          - { typo3: '14.3', php: '8.4', framework: '^9.0', phpunit: '^12.1' }
    defaults:
      run:
        working-directory: packages/playwright-toolkit
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, intl
          coverage: none

      - name: Pin the toolchain for TYPO3 ${{ matrix.typo3 }}
        run: |
          # The QA tools are not run here and would block the older cores:
          # phpstan-typo3 requires cms-core ^13.4.3 and is uninstallable beside 11.5.
          composer remove --dev --no-update --no-interaction \
            phpstan/phpstan phpstan/extension-installer saschaegerer/phpstan-typo3 \
            friendsofphp/php-cs-fixer rector/rector
          composer require --dev --no-update --no-interaction \
            "typo3/testing-framework:${{ matrix.framework }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}"
          composer require --no-update --no-interaction \
            "typo3/cms-core:^${{ matrix.typo3 }}" "typo3/cms-backend:^${{ matrix.typo3 }}"
          # Supported older cores carry advisories that consumers cover with ELTS.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress

      # No -c: the checked-in configs declare a PHPUnit 12 schema, and the older
      # rows run PHPUnit 10. Everything those configs set is passed here instead.
      - name: Unit tests
        run: >-
          php -d memory_limit=-1 vendor/bin/phpunit
          --bootstrap vendor/autoload.php
          --fail-on-warning --do-not-cache-result Tests/Unit

      - name: Functional tests
        env:
          typo3DatabaseDriver: pdo_sqlite
        run: >-
          php -d memory_limit=-1 vendor/bin/phpunit
          --bootstrap vendor/typo3/testing-framework/Resources/Core/Build/FunctionalTestsBootstrap.php
          --fail-on-warning --do-not-cache-result Tests/Functional

  # The package ships against PHP 8.1 while its own toolchain needs 8.3 (phpunit
  # 12), so the floor cannot be proven by running the suite. It is proven twice
  # instead: the syntax has to parse on a real 8.1, and rector has to find nothing
  # left to downgrade. phpstan's phpVersion pins it a third time inside `qa`.
  php-floor:
    name: extension (php 8.1 floor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/playwright-toolkit
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Every shipped file parses on 8.1
        run: find Classes Configuration Tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

  # Compatibility is a claim about other people's TYPO3, so it is checked against
  # the real thing: the package is installed next to each supported core and
  # analysed against its actual API. This is what caught v14 making SchemaMigrator
  # a readonly class, which no test of ours would have noticed.
  typo3-versions:
    name: extension (typo3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 11.5 needs a config of its own: two findings that are errors only there.
          - typo3: '11.5'
            php: '8.1'
            phpstan-config: .github/typo3-11/phpstan.neon
          - typo3: '12.4'
            php: '8.1'
            phpstan-config: ''
          - typo3: '13.4'
            php: '8.2'
            phpstan-config: ''
          - typo3: '14.3'
            php: '8.2'
            phpstan-config: ''
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, intl
          coverage: none

      - name: Install the package beside TYPO3 ${{ matrix.typo3 }}
        run: |
          mkdir -p /tmp/matrix && cd /tmp/matrix
          composer init --no-interaction --name=tmp/matrix
          composer config repositories.pkg path "$GITHUB_WORKSPACE/packages/playwright-toolkit"
          composer config allow-plugins.typo3/class-alias-loader true
          composer config allow-plugins.typo3/cms-composer-installers true
          # Supported releases of an older core carry advisories that ELTS covers;
          # they must not stop us from checking the API against them.
          composer config policy.advisories.block false
          composer config minimum-stability dev
          composer config prefer-stable true
          composer require --no-interaction --no-scripts --no-audit \
            plan2net/playwright-toolkit:@dev \
            "typo3/cms-core:^${{ matrix.typo3 }}" \
            "typo3/cms-backend:^${{ matrix.typo3 }}" \
            phpstan/phpstan:^2.1

      - name: Analyse against the real ${{ matrix.typo3 }} API
        env:
          PHPSTAN_CONFIG: ${{ matrix.phpstan-config }}
        run: |
          cd /tmp/matrix
          config=()
          [ -n "${PHPSTAN_CONFIG}" ] && config=(-c "$GITHUB_WORKSPACE/${PHPSTAN_CONFIG}")
          php -d memory_limit=1G vendor/bin/phpstan analyse \
            "$GITHUB_WORKSPACE/packages/playwright-toolkit/Classes" \
            "${config[@]}" \
            --level=5 --autoload-file=vendor/autoload.php \
            --no-progress --error-format=table

  addon:
    name: add-on (bats)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ddev-typo3-playwright-toolkit
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      # Every hermetic suite: they source the shared lib, stub the typo3 binary and
      # need no Docker. tests/test.bats drives DDEV itself and runs in e2e.yml.
      - run: >-
          bats tests/argument-forwarding.bats tests/prepare-template.bats
          tests/db-test-service.bats tests/install-manifest.bats
          tests/test-directory.bats tests/browser-server.bats
          tests/replay.bats

  shell:
    name: add-on (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # No -s: each file declares its own shell, and the commands are a mix of
      # sh and bash. Forcing one dialect reports fictional problems.
      - name: Check the shared library and commands
        working-directory: packages/ddev-typo3-playwright-toolkit
        run: shellcheck -S warning playwright-lib.sh commands/web/*

  # The drivers skip themselves when no server answers, so without this job the
  # postgres and mysql ones are only ever verified by hand. --fail-on-skipped is
  # the whole point. Sqlite needs no job of its own: the version matrix above runs
  # the functional suite on it for every supported core.
  drivers:
    name: test-database drivers (postgres + mysql)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/playwright-toolkit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
          POSTGRES_DB: db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, intl
          coverage: none

      - run: composer update --no-interaction --no-progress

      # The same grant the add-on ships as init SQL. Applying it here means CI runs
      # as the unprivileged `db` user a consumer has, not as root — MARIADB_USER is
      # granted its own database only, and the driver creates and drops many.
      # Installed rather than assumed: the runner image ships whichever client it
      # ships, under whichever name, and that is not something to depend on.
      - name: Install a MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Grant the test user what provisioning needs
        run: |
          mariadb -h 127.0.0.1 -P 3306 -uroot -proot \
            < ../ddev-typo3-playwright-toolkit/mysql/db-test-init.sql

      # --fail-on-skipped is the point of this job: these tests skip themselves
      # when no server answers, so without it a broken service would look green.
      - name: Driver suites against real servers
        env:
          typo3DatabaseDriver: pdo_sqlite
          PW_TEST_POSTGRES_HOST: 127.0.0.1
          PW_TEST_POSTGRES_USER: db
          PW_TEST_POSTGRES_PASSWORD: db
          PW_TEST_MYSQL_HOST: 127.0.0.1
          PW_TEST_MYSQL_USER: db
          PW_TEST_MYSQL_PASSWORD: db
        run: >-
          vendor/bin/phpunit -c phpunit.functional.xml.dist
          --filter '(Postgres|Mysql)TestDatabaseDriverTest|TemplatePreparerMysqlTest|DatabaseInitializer(Postgres|Mysql)ProvisionTest'
          --fail-on-skipped
