name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No cancel-in-progress, unlike checks: this runs on main only, where every commit
# is a point in history someone may come back to. Cancelling would leave commits
# that were never verified end to end, and paint the badge "failing" whenever two
# pushes land inside one run.
concurrency:
  group: e2e-${{ github.ref }}

jobs:
  header-chain:
    name: header chain in DDEV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      # Proves the invariant the whole design rests on: the test-ID header reaches
      # PHP with no webserver configuration, and selects the derived database. The
      # suite covers apache-fpm and nginx-fpm itself, creating and deleting its own
      # DDEV project for each.
      - name: Header chain
        working-directory: packages/ddev-typo3-playwright-toolkit
        run: bats tests/test.bats

  consumer-install:
    name: install the packed tarball into a consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/typo3-playwright-toolkit/package-lock.json

      - name: Install toolkit dependencies
        working-directory: packages/typo3-playwright-toolkit
        run: npm ci

      # Deliberately the tarball, never the working tree. The exports-map failure
      # that broke a real consumer only appeared through a packed install; a job
      # importing from source would have stayed green through it.
      - name: Pack and consume
        working-directory: packages/typo3-playwright-toolkit
        run: npm run test:pack

  consumer-chain:
    name: consumer chain (typo3 ${{ matrix.typo3 }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        typo3: ['13.4', '14.3']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/typo3-playwright-toolkit/package-lock.json

      - uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      # Composer and the browsers are installed inside the web container, so the
      # runner's usual cache paths are never written. Both are redirected into the
      # project directory (see .ddev/config.yaml) and cached from there.
      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: tests/e2e/consumer/.cache/composer
          key: e2e-composer-${{ matrix.typo3 }}-${{ hashFiles('tests/e2e/consumer/composer.json') }}
          restore-keys: e2e-composer-${{ matrix.typo3 }}-

      # Keyed on the lock file, which is where run.sh reads the exact version from.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: tests/e2e/consumer/.cache/ms-playwright
          key: e2e-browsers-${{ hashFiles('packages/typo3-playwright-toolkit/package-lock.json') }}

      - name: Install all three packages and drive defineScenario
        env:
          PW_E2E_TYPO3: ${{ matrix.typo3 }}
        run: tests/e2e/run.sh

      - name: Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-typo3-${{ matrix.typo3 }}
          path: |
            tests/e2e/consumer/tests/playwright/test-results/
            tests/e2e/consumer/tests/playwright/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

