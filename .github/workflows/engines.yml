name: engines

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: true

# Two different axes, deliberately kept apart:
#
#   functional  which engine TYPO3 itself boots on. Only sqlite is listed:
#               running the suite with typo3DatabaseDriver=pdo_pgsql fails during
#               bootstrap, before any test executes.
#   drivers     which test-database servers the drivers are exercised against.
#               These tests skip when no server answers, so without this job the
#               postgres and mysql drivers are only ever verified by hand.
jobs:
  functional:
    name: functional (${{ matrix.engine }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sqlite
            driver: pdo_sqlite
    defaults:
      run:
        working-directory: packages/playwright-toolkit
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, intl
          coverage: none

      - run: composer update --no-interaction --no-progress

      # The matrix must be a real axis, not a label: a job claiming one engine
      # while running another would hide exactly the failures this exists to catch.
      - name: Assert the driver is available and is the one claimed
        env:
          DRIVER: ${{ matrix.driver }}
        run: |
          php -r '
            $driver = getenv("DRIVER");
            $pdo = ["pdo_sqlite" => "sqlite", "pdo_pgsql" => "pgsql", "pdo_mysql" => "mysql"][$driver] ?? null;
            if ($pdo === null) { fwrite(STDERR, "unknown driver $driver\n"); exit(1); }
            if (!in_array($pdo, PDO::getAvailableDrivers(), true)) {
              fwrite(STDERR, "PDO driver $pdo missing for $driver\n");
              exit(1);
            }
            echo "resolved $driver via PDO $pdo\n";
          '

      - name: Functional suite
        env:
          typo3DatabaseDriver: ${{ matrix.driver }}
        run: composer test:functional

  drivers:
    name: test-database drivers (postgres + mysql)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/playwright-toolkit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: db
          POSTGRES_PASSWORD: db
          POSTGRES_DB: db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, pdo_pgsql, pdo_mysql, intl
          coverage: none

      - run: composer update --no-interaction --no-progress

      # The same grant the add-on ships as init SQL. Applying it here means CI runs
      # as the unprivileged `db` user a consumer has, not as root — MARIADB_USER is
      # granted its own database only, and the driver creates and drops many.
      # Installed rather than assumed: the runner image ships whichever client it
      # ships, under whichever name, and that is not something to depend on.
      - name: Install a MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Grant the test user what provisioning needs
        run: |
          mariadb -h 127.0.0.1 -P 3306 -uroot -proot \
            < ../ddev-typo3-playwright-toolkit/mysql/db-test-init.sql

      # --fail-on-skipped is the point of this job: these tests skip themselves
      # when no server answers, so without it a broken service would look green.
      - name: Driver suites against real servers
        env:
          typo3DatabaseDriver: pdo_sqlite
          PW_TEST_POSTGRES_HOST: 127.0.0.1
          PW_TEST_POSTGRES_USER: db
          PW_TEST_POSTGRES_PASSWORD: db
          PW_TEST_MYSQL_HOST: 127.0.0.1
          PW_TEST_MYSQL_USER: db
          PW_TEST_MYSQL_PASSWORD: db
        run: >-
          vendor/bin/phpunit -c phpunit.functional.xml.dist
          --filter '(Postgres|Mysql)TestDatabaseDriverTest|TemplatePreparerMysqlTest|DatabaseInitializer(Postgres|Mysql)ProvisionTest'
          --fail-on-skipped
