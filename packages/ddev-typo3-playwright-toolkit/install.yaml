name: typo3-playwright-toolkit

ddev_version_constraint: '>= v1.25.0'

dependencies: []

project_files:
  - db-test/docker-compose.postgres.yaml
  - db-test/docker-compose.mariadb.yaml
  - db-test/docker-compose.mysql.yaml
  - db-test/select-service.sh
  - postgres/db-test-init.sql
  - mysql/db-test-init.sql
  - playwright-lib.sh
  - playwright-approve.mjs
  - commands/web/playwright
  - playwright-commands/inspect.sh
  - playwright-commands/doctor.sh
  - playwright-commands/prepare.sh
  - playwright-commands/replay.sh
  - commands/web/playwright-ui
  - config.playwright-toolkit.yaml
  # DDEV records no version for a tarball install, so the extension reads this one.
  - playwright-toolkit.version

global_files: []

pre_install_actions: []

post_install_actions:
  - bash db-test/select-service.sh

removal_actions:
  - rm -f docker-compose.db-test.yaml
